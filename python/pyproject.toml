[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pixel-lab"
version = "2.0.0"
description = "Image processing from first principles: every algorithm hand-written in pure Python."
readme = "README.md"
license = "MIT"
authors = [{ name = "Hasan Jwaied" }]
requires-python = ">=3.10"
# Pillow is used only to decode and encode image files. Every pixel operation is ours.
dependencies = ["Pillow>=10.3"]  # 10.3 has the fixes for CVE-2023-4863, CVE-2023-50447 and CVE-2024-28219
keywords = ["image-processing", "computer-vision", "algorithms", "seam-carving", "canny"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pixel-lab = "pixel_lab.cli:main"

[project.urls]
Homepage = "https://github.com/hasan-jwaied/image-editor"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B905: zip() lengths are equal by construction and strict=True costs time in hot loops.
# RUF001: sigma (σ) in complexity strings is intentional.
ignore = ["E741", "B905", "RUF001", "RUF007"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts/generate_golden.py", "scripts/generate_spec.py"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
