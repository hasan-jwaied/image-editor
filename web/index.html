<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Lab: image processing from first principles</title>
    <meta
      name="description"
      content="Nineteen image-processing algorithms written from scratch in Python and TypeScript, verified pixel for pixel, with interactive explanations. Runs entirely in your browser."
    />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Pixel Lab: image processing from first principles" />
    <meta property="og:description" content="Seam carving, Canny edges, dithering and more, hand-written and explained. Your photos never leave your device." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Apply a stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('pixel-lab:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        var l = localStorage.getItem('pixel-lab:lang')
        if (l === 'ar' || l === 'he') { document.documentElement.lang = l; document.documentElement.dir = 'rtl' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pixel Lab needs JavaScript: every algorithm runs in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
