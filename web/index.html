<html lang="en" dir="ltr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Lab: image processing from first principles · Hasan Jwaied</title>
    <meta
      name="description"
      content="Nineteen image processing algorithms, including seam carving, Canny edges and dithering, written from scratch in Python and TypeScript, verified pixel for pixel and explained interactively. Runs entirely in your browser."
    />
    <meta name="author" content="Hasan Jwaied" />
    <link rel="canonical" href="%VITE_CANONICAL_URL%" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pixel Lab: image processing from first principles" />
    <meta
      property="og:description"
      content="Seam carving, Canny edges, dithering and more, written by hand and explained. Your photos never leave your device."
    />
    <meta property="og:url" content="%VITE_CANONICAL_URL%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Same key and class as the portfolio (next-themes, default light), applied
      // before first paint so there is no flash. Language is the lab's own.
      try {
        var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
        var root = document.documentElement
        root.className = t
        root.style.colorScheme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#000000' : '#f5f5f7'
        var l = localStorage.getItem('pixel-lab:lang')
        if (l === 'he') {
          root.lang = 'he'
          root.dir = 'rtl'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Pixel Lab needs JavaScript: every algorithm runs in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
